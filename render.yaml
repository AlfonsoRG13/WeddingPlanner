services:
  - type: web
    name: wedding-planner
    runtime: node
    region: oregon
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-planner-db
          property: connectionString
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true

databases:
  - name: wedding-planner-db
    databaseName: weddingplanner
    user: weddingplanner
    region: oregon
    plan: basic-256mb
